# Runs on every pull request into staging or main, and on every push to them.
# A red cross on the pull request means don't merge yet.
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receiptkit-tests:
    name: ReceiptKit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Run tests
        run: swift test --package-path Packages/ReceiptKit

  app-build:
    name: App builds
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build for the iOS Simulator (no signing needed)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SpendScan.xcodeproj \
            -scheme SpendScan \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          xcodebuild build \
            -project SpendScan.xcodeproj \
            -scheme SpendScan \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
